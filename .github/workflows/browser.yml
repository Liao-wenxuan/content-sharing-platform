name: Browser

# 这个工作流只放**贵**的两个 job：e2e（15 套 Playwright）和 a11y（axe-core）。
#
# 为什么单独拆一个文件，而不是放在 ci.yml 里用 job 级过滤：
# **GitHub 的 paths / paths-ignore 只存在于 on.<event> 层，不存在于 job 层。**
# 写成 jobs.<id>.paths-ignore 会让整个工作流文件被判为非法：
#   Invalid workflow file: (Line: 132, Col: 5): Unexpected value 'paths-ignore'
# 而且本地用 YAML 解析器是能解析通过的 —— 只有 GitHub 自己的 schema 校验会拒绝它。
#
# 拆开之后，两件事同时成立：
#   - ci.yml（typecheck / 单测 / prettier）**永远跑**，是任何 push 的底线；
#   - 这个工作流在**纯文档提交**时整体跳过，省掉约 5 分钟。
#
# 为什么用 paths-ignore 而不是 paths：
# paths 要把每一个源码目录逐个列出来，将来新增一个目录忘了列，
# 这个工作流就会被**静默跳过** —— 那是危险的失败方向（该跑没跑，报告还是绿的）。
# paths-ignore 只在**所有**改动都是文档时才跳过，其余一律全跑。
#
# 代价要说清楚：docs-only 的 push 拿不到 e2e / a11y 信号。
# 这个仓库里 e2e 断言的是页面行为，文档改动碰不到它，所以这个代价值得；
# 换个断言文档的项目，这条就不成立了。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/screenshots/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/screenshots/**'

jobs:
  # ===== 浏览器侧：15 套 e2e =====
  #
  # 不设 needs：故意和 a11y 并行。挂上 needs 看着省事（前面红了就不用跑），
  # 但代价是**一次 push 只拿一份信号** —— 单测挂了看不到 e2e 到底坏没坏，
  # 只能改完再推一次才知道。这个仓库是公开的，Actions 不计费，那就全跑。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - uses: ./.github/actions/web-env

      - name: Warm up the dev server
        # vite 的依赖预优化是边跑边发现的：每发现一批新依赖就重新预构建，
        # 并且**触发一次整页 reload**。一次 e2e 跑下来能砸出七八轮，
        # 页面被强制刷新 = SPA 状态全丢，断言就开始随机失败。
        # 本地看不到（依赖早缓存好了），CI 的 dev server 永远是冷的。
        # 先把所有路由跑一遍把这份成本付掉，见 scripts/warmup-web.mjs。
        run: node scripts/warmup-web.mjs

      - name: Run 15 e2e suites
        # 脚本自己会跑完全部 15 套再汇总，而不是第一个失败就停 ——
        # 停了就只能知道「有东西坏了」，跑完才知道是哪几个。
        run: node scripts/run-e2e-ci.mjs

      - name: Upload logs
        # CI 里失败现场最容易丢：日志在滚屏里滚过去就没了。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            .e2e-logs/
            ${{ runner.temp }}/*.log
          retention-days: 7
          # ⚠️ 必须显式开这个：upload-artifact v4 默认 include-hidden-files=false，
          # 而 `.e2e-logs/` 以点开头会被当成隐藏目录**静默跳过** ——
          # 上传照样「成功」，但里面只有 $RUNNER_TEMP 里那两个日志，
          # 真正想留的逐套输出一个都没有。
          include-hidden-files: true

  # ===== 浏览器侧：无障碍 =====
  a11y:
    name: A11Y (axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - uses: ./.github/actions/web-env
        with:
          # 无障碍验的是**生产产物** —— 用户拿到的是 dist，不是 dev server。
          # 顺带快得多：vite dev 每个路由首次访问要现编译。
          web-mode: preview

      - name: Dark theme
        run: npm run a11y

      - name: Light theme
        # 两个主题都要跑：浅色的违规曾经单独出现过 101 处，
        # 只审深色等于把一半的代码路径没验过。
        run: npm run a11y -- --light

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
