name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== 后端测试 + 类型检查 =====
  server:
    name: Server (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # ===== 前端类型检查 + 编译 =====
  client:
    name: Client (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript + Vue typecheck
        run: npx vue-tsc --noEmit

      - name: Build (catches SSR/build-time errors)
        run: npm run build

  # ===== 根目录 lint（husky 已经在本地跑，这里做远程兜底）=====
  lint:
    name: Lint (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npm run format:check
        continue-on-error: false