name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== Node 版本必须 >= 22，别改回 20 =====
  # server 依赖 vitest@5（engines: ^22.12.0 || ^24.0.0 || >=26.0.0）
  # 和 better-sqlite3@13（engines: >=22），两边都不支持 Node 20。
  #
  # 这里原来写的是 '20'，踩过一个坑：`npm ci` 遇到 engines 不匹配只发
  # warning、不会失败，所以「Install deps」那一步显示绿灯，很有迷惑性；
  # 但紧接着的 `vitest run` 会真的挂掉，只留下一个没有上下文的
  # "Process completed with exit code 1"。本地是 Node 24 所以完全复现不出来。
  # 现在统一用 24，和本地开发环境保持一致。
  #
  # ===== 后端测试 + 类型检查 =====
  server:
    name: Server (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # ===== 前端类型检查 + 编译 =====
  client:
    name: Client (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript + Vue typecheck
        # 必须显式 -p tsconfig.app.json：
        # tsconfig.json 是 solution-style（files: [] + references），
        # 直接 `vue-tsc --noEmit` 什么都不检查，错误会被静默放过。
        # tsconfig.app.json 的 include 里带上了 tests/，所以单测的类型错误也一起查。
        run: npx vue-tsc --noEmit -p tsconfig.app.json

      - name: Unit tests (vitest + @vue/test-utils) with coverage
        # 跑覆盖率而不是裸 `npm test`：vitest.config.ts 里配了 thresholds，
        # 跌破 60% 会直接让这一步失败，等于把「覆盖率」变成 CI 门禁而不只是一个报告。
        # 统计范围只含 utils / composables / components（见 vitest.config.ts），
        # main.ts 和样式进覆盖率只会把数字做低，没有任何信息量。
        run: npm run test:coverage

      - name: Build (catches SSR/build-time errors)
        run: npm run build

      - name: Bundle budget (entry chunk)
        # 上一步刚产出生产构建，这里直接量它。
        # 放在 CI 而不是只在本地跑，是因为「改完先在本地过一遍」这件事
        # 必然会有忘记的时候 —— 而首屏体积退化恰恰是那种没人会主动想起来
        # 去检查的东西：它不报错、功能正常，只是慢慢变慢。
        # 脚本只用 node 内置模块，不需要在 client/ 再装依赖。
        run: node ../scripts/bundle-budget.mjs

  # ===== 根目录 lint（husky 已经在本地跑，这里做远程兜底）=====
  lint:
    name: Lint (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: false

      - name: Prettier check
        run: npm run format:check
        continue-on-error: false

  # ===== 浏览器侧：14 套 e2e =====
  #
  # 不设 needs：故意和上面三个 job 并行。挂上 needs 看着省事（前面红了就不用跑），
  # 但代价是**一次 push 只拿一份信号** —— 单测挂了就看不到 e2e 到底坏没坏，
  # 只能改完再推一次才知道。这个仓库是公开的，Actions 不计费，那就全跑。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - uses: ./.github/actions/web-env

      - name: Run 14 e2e suites
        # 脚本自己会跑完 14 套再汇总，而不是第一个失败就停 ——
        # 停了就只能知道「有东西坏了」，跑完才知道是哪几个。
        run: node scripts/run-e2e-ci.mjs

      - name: Upload logs
        # CI 里失败现场最容易丢：日志在滚屏里滚过去就没了。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            .e2e-logs/
            ${{ runner.temp }}/*.log
          retention-days: 7

  # ===== 浏览器侧：无障碍 =====
  a11y:
    name: A11Y (axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependity-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - uses: ./.github/actions/web-env

      - name: Dark theme
        run: npm run a11y

      - name: Light theme
        # 两个主题都要跑：浅色的违规曾经单独出现过 101 处，
        # 只审深色等于把一半的代码路径没验过。
        run: npm run a11y -- --light

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
