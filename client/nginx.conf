# ===== 容器内的静态托管 + 反向代理 =====
# 为什么要自己写而不是用 vite preview：
#   1. vite preview 不带反代，前端请求会打到自己身上；
#   2. 真正上线也是这个结构（静态资源 + 反代 API），用 nginx 提前对齐。
#
# 三个必须反代出去的前缀：
#   /api     —— 业务接口
#   /uploads —— 上传的图片存在后端，这里只存文件名
#   /ws      —— WebSocket，缺了 Upgrade 头握手会失败

upstream sg_server {
    server server:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传接口允许 9 张图、单张上限比默认大，
    # nginx 默认 client_max_body_size 只有 1M，发布会直接 413
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://sg_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://sg_server;
        proxy_set_header Host $host;
    }

    # WebSocket：Connection 必须是 upgrade，且读超时要比后端心跳长。
    # 后端 30s 发一次 ping，这里给 3600s 不会误杀正常连接；
    # 真断线时后端的 pong 超时会先一步把连接关掉，不靠 nginx 超时兜底。
    location /ws {
        proxy_pass http://sg_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA：前端是 history 路由，直接访问 /search?q=xx 也要回 index.html，
    # 否则刷新页面就 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
